name: Build GTAV HUD launcher IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL GTAV-unsigned.ipa (direct link)'
        required: true
      release_tag:
        description: 'Tag release untuk IPA hasil (kosong = artifact sahaja)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download IPA
        env: { IPA_URL: "${{ inputs.ipa_url }}" }
        run: curl -fL "$IPA_URL" -o GTAV-unsigned.ipa && ls -l GTAV-unsigned.ipa
      - name: Build HUD IPA
        working-directory: hudskin
        run: ./build_ipa.sh ../GTAV-unsigned.ipa ../GTAV-hud-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with: { name: GTAV-hud-unsigned, path: GTAV-hud-unsigned.ipa }
      - name: Publish release
        if: inputs.release_tag != ''
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", TAG: "${{ inputs.release_tag }}" }
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "GTAV HUD $TAG" --notes "Unsigned IPA, HUD launcher skin."
          gh release upload "$TAG" GTAV-hud-unsigned.ipa --clobber
